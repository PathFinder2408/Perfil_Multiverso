{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso | Francisco Santander</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        body, html { height: 100%; margin: 0; overflow-x: hidden; background-color: #000; }
        .split-container { display: flex; flex-wrap: wrap; height: 100vh; }
        
        .split-pane {
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            text-decoration: none;
            /* 1. Aumentamos a 0.9s y usamos ease-in-out para un freno suave */
            transition: flex 0.9s ease-in-out, filter 0.9s ease-in-out;
            position: relative;
            background-size: cover;
            background-position: center;
            z-index: 1; /* Nivel base */
        }
        
        @media (max-width: 768px) {
            .split-pane { flex: 1 1 100%; } 
        }
        
        /* Efecto de expansión y aclarado al pasar el mouse */
        .split-pane:hover { 
            flex: 1.25; 
            filter: brightness(1.1);
            /* 2. El panel activo se sobrepone al otro, evitando el parpadeo en el borde */
            z-index: 10;
        }
        
        /* Carga de imágenes con una capa oscura (overlay) superpuesta */
        .pane-ti { 
            background-image: linear-gradient(rgba(9, 18, 33, 0.7), rgba(23, 42, 69, 0.8)), url("{% static 'img/tech_header.jpg' %}");
            border-right: 2px solid rgba(255,255,255,0.2); 
        }
        .pane-obras { 
            background-image: linear-gradient(rgba(42, 17, 10, 0.6), rgba(94, 33, 0, 0.8)), url("{% static 'img/obras_header.jpg' %}");
        }
        
        .multiverse-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: 800;
            letter-spacing: 6px;
            z-index: 10;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
            pointer-events: none;
            text-transform: uppercase;
        }

        .pane-content {
            z-index: 2;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            transition: transform 0.4s ease;
        }

        .split-pane:hover .pane-content {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    
    <h2 class="multiverse-title text-center">PORTAFOLIO MULTIVERSO</h2>
    
    <div class="split-container">
        <!-- Portal de Tecnología -->
        <a href="/ti/" class="split-pane pane-ti">
            <div class="pane-content">
                <h1 class="display-3 fw-bold">Universo TI</h1>
                <p class="lead fw-semibold text-light">Desarrollo de Software & Arquitectura</p>
                <span class="btn btn-info mt-3 rounded-pill px-5 text-white fw-bold shadow-lg">Ingresar al Portal TI</span>
            </div>
        </a>
        
        <!-- Portal de Construcción -->
        <a href="/obras/" class="split-pane pane-obras">
            <div class="pane-content">
                <h1 class="display-3 fw-bold">Universo Construccion</h1>
                <p class="lead fw-semibold text-light">Obras Civiles, Estructuras & Gestión</p>
                <span class="btn btn-warning mt-3 rounded-pill px-5 fw-bold shadow-lg text-dark">Ingresar al Portal Obra</span>
            </div>
        </a>
    </div>

</body>
</html>
