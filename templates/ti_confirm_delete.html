{% extends 'base.html' %}
{% load static %}

{% block header %}
<style>
    body { background-color: #020617 !important; color: #f8fafc !important; }
    main, .container, .bg-light, .bg-white { background-color: transparent !important; }
    .hud-panel {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
</style>
<div class="py-5 text-center">
    <h1 class="display-5 fw-bolder text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Confirmar Eliminación</h1>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-6">
        <div class="hud-panel p-5 text-center">
            <h4 class="mb-4">¿Estás seguro que deseas eliminar "{{ object }}"?</h4>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mt-4">
                    <a href="{% url 'inicio_ti' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold">Eliminar Definitivamente</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
